name: Tests

on:
  push:
    branches: [main]
    paths:
      - "ism7mqtt/src/**"
      - "ism7mqtt/run.sh"
      - ".github/workflows/tests.yaml"
  pull_request:
    branches: [main]
    paths:
      - "ism7mqtt/src/**"
      - "ism7mqtt/run.sh"
      - ".github/workflows/tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Check startup wrapper syntax
        run: bash -n ism7mqtt/run.sh
      - name: Run regression tests
        run: dotnet test ism7mqtt/src/ism7mqtt.Tests/ism7mqtt.Tests.csproj --configuration Release
